<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>精选项目 · 原图加右侧文案</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #f6f2ea; color: #1d1b19; font-family: "Songti SC", "Noto Serif CJK SC", serif; }
    .frame {
      width: 1600px;
      min-height: 1200px;
      margin: 0 auto;
      padding: 58px 76px 70px;
      background: #f6f2ea url("../../assets/paper-texture.png") repeat;
      background-size: 420px auto;
    }
    .rule { height: 1px; background: #c9c2b7; margin-bottom: 26px; }
    .layout { display: grid; grid-template-columns: 660px 1fr; gap: 116px; align-items: start; }
    .master { width: 660px; margin-top: 10px; }
    .master img { display: block; width: 600px; height: auto; margin: 0 auto; }
    .copy { padding-top: 118px; max-width: 500px; }
    .eyebrow { margin-bottom: 36px; color: #777168; font: 14px/1.4 Arial, sans-serif; letter-spacing: .17em; }
    h1 { margin: 0; font-size: 54px; line-height: 1.35; font-weight: 500; }
    .intro { margin: 38px 0 52px; color: #68635b; font-size: 21px; line-height: 1.8; }
    .copy-block { padding: 24px 0 26px; border-top: 1px solid #c9c2b7; }
    .copy-block:last-child { border-bottom: 1px solid #c9c2b7; }
    .copy-block .index { color: #2f6df6; font: 13px/1.3 Arial, sans-serif; letter-spacing: .13em; }
    .copy-block h2 { margin: 10px 0 8px; font-size: 28px; line-height: 1.3; font-weight: 500; }
    .copy-block p { margin: 0; color: #68635b; font-size: 17px; line-height: 1.65; }
  </style>
</head>
<body>
  <main class="frame">
    <div class="rule"></div>
    <div class="layout">
      <figure class="master">
        <img src="../视觉母版/works-open-fields-master-v1.png" alt="精选项目原图：四个项目与连续蓝线">
      </figure>
      <section class="copy">
        <div class="eyebrow">WORKS / 精选项目</div>
        <h1>把问题看清楚，<br>再一起做成。</h1>
        <p class="intro">四个项目，从真实场景出发，分别处理可见性、协同、用户洞察与交付。</p>
        <article class="copy-block"><div class="index">01 / 02</div><h2>从问题到系统</h2><p>先厘清规则和边界，再把复杂协同变成可以执行的路径。</p></article>
        <article class="copy-block"><div class="index">03 / 04</div><h2>从洞察到落地</h2><p>把用户需要、产品取舍和交付节奏放在同一张桌子上。</p></article>
      </section>
    </div>
  </main>
</body>
</html>
