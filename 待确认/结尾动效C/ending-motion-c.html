<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ending motion / C</title>
  <style>
    :root {
      --paper: #f2efe7;
      --ink: #1b1b18;
      --ink-soft: #6f6b63;
      --blue: #2f63e9;
      --ease: cubic-bezier(.16, 1, .3, 1);
    }

    * { box-sizing: border-box; }

    html {
      min-width: 320px;
      background: var(--paper) url("../../assets/paper-texture.png") repeat;
      background-size: 200px 200px;
    }

    body {
      min-width: 320px;
      min-height: 100dvh;
      margin: 0;
      color: var(--ink);
      font-family: "Songti SC", "STSong", "Noto Serif CJK SC", serif;
    }

    .prototype {
      display: grid;
      min-height: 100dvh;
      place-items: center;
      padding: clamp(2rem, 7vw, 6rem) 1.2rem;
      text-align: center;
    }

    .scene {
      display: grid;
      width: min(100%, 1100px);
      justify-items: center;
      gap: 1.4rem;
    }

    .kicker {
      color: var(--blue);
      font-size: .78rem;
      letter-spacing: .12em;
    }

    .copy {
      display: grid;
      gap: .1em;
      max-width: 14ch;
      margin: 0;
      font-size: clamp(2.2rem, 6vw, 5.5rem);
      font-weight: 400;
      letter-spacing: -.06em;
      line-height: 1.08;
    }

    .copy span { display: block; }

    .art {
      display: none;
      width: min(100%, 1060px);
      overflow: visible;
    }

    .art.is-visible { display: block; }

    svg {
      display: block;
      width: 100%;
      height: auto;
      overflow: visible;
    }

    .frame { display: none; }
    .frame.is-active { display: block; }

    .outline {
      fill: var(--paper);
      stroke: var(--ink);
      stroke-width: 2.3;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .ink-patch { fill: var(--ink); opacity: .96; }

    .route {
      fill: none;
      stroke: var(--blue);
      stroke-width: 2.6;
      stroke-linecap: round;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
      stroke-dasharray: 1;
      stroke-dashoffset: 1;
    }

    .frame.is-active .route {
      animation: drawRoute .72s var(--ease) both;
    }

    .bead {
      fill: var(--blue);
      opacity: 0;
    }

    .frame.is-active .bead {
      animation: beadIn .4s .45s var(--ease) both;
    }

    .prompt,
    .final-copy {
      display: none;
    }

    .prompt.is-visible,
    .final-copy.is-visible { display: block; }

    .prompt {
      color: var(--blue);
      font-size: .82rem;
    }

    .final-copy {
      max-width: 28ch;
      color: var(--ink-soft);
      font-size: clamp(1.2rem, 2.4vw, 2rem);
      line-height: 1.65;
    }

    .final-copy strong {
      display: block;
      margin-top: .65rem;
      color: var(--blue);
      font-weight: 400;
    }

    button {
      border: 0;
      border-bottom: 1px solid color-mix(in srgb, var(--blue) 60%, transparent);
      padding: .25rem 0;
      background: transparent;
      color: var(--blue);
      font: inherit;
      font-size: .78rem;
      cursor: pointer;
      transition: gap .3s var(--ease), color .3s ease;
    }

    button:hover,
    button:focus-visible { color: var(--ink); }

    @keyframes drawRoute {
      from { stroke-dashoffset: 1; opacity: .15; }
      to { stroke-dashoffset: 0; opacity: 1; }
    }

    @keyframes beadIn {
      from { opacity: 0; transform: scale(.5); transform-origin: center; }
      to { opacity: 1; transform: scale(1); transform-origin: center; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>

      <p class="prompt is-visible" id="prompt">点击开始动效 ↗</p>
      <div class="final-copy" id="finalCopy">关于真实的人，关于细小的感受，也关于一个产品还能不能再好一点。<strong>我还在找答案。<br>也会继续做下去。</strong></div>
      <button id="advance" type="button">开始动效 ↗</button>
    </section>
  </main>

  <script>
    const art = document.getElementById("art");
    const openingCopy = document.getElementById("openingCopy");
    const prompt = document.getElementById("prompt");
    const finalCopy = document.getElementById("finalCopy");
    const advance = document.getElementById("advance");
    const frames = [...document.querySelectorAll(".frame")];
    let currentFrame = 0;
    let isPlaying = false;
    let sequenceTimers = [];

    function showFrame(frameNumber) {
      currentFrame = frameNumber;
      frames.forEach((frame) => {
        frame.classList.toggle("is-active", Number(frame.dataset.frame) === frameNumber);
      });
      art.classList.add("is-visible");
      openingCopy.style.display = "none";
      finalCopy.classList.remove("is-visible");
      prompt.textContent = frameNumber >= 6 ? "最后一帧 / 保持 ↗" : "动效进行中 ↗";
      prompt.classList.add("is-visible");
    }

    function finishSequence() {
      art.classList.remove("is-visible");
      prompt.classList.remove("is-visible");
      finalCopy.classList.add("is-visible");
      advance.textContent = "再看一遍 ↗";
      advance.style.display = "inline-block";
      advance.disabled = false;
      advance.style.opacity = "1";
      isPlaying = false;
    }

    function playSequence() {
      isPlaying = true;
      advance.disabled = true;
      advance.style.opacity = ".35";
      showFrame(1);

      [2, 3, 4, 5, 6].forEach((frameNumber, index) => {
        sequenceTimers.push(window.setTimeout(() => showFrame(frameNumber), 820 * (index + 1)));
      });

      sequenceTimers.push(window.setTimeout(finishSequence, 820 * 5 + 1450));
    }

    function resetSequence() {
      sequenceTimers.forEach((timer) => window.clearTimeout(timer));
      sequenceTimers = [];
      currentFrame = 0;
      isPlaying = false;
      art.classList.remove("is-visible");
      finalCopy.classList.remove("is-visible");
      prompt.textContent = "点击开始动效 ↗";
      prompt.classList.add("is-visible");
      openingCopy.style.display = "grid";
      advance.textContent = "开始动效 ↗";
      advance.style.display = "inline-block";
      advance.disabled = false;
      advance.style.opacity = "1";
    }

    advance.addEventListener("click", () => {
      if (isPlaying) return;
      if (currentFrame >= 6 || finalCopy.classList.contains("is-visible")) {
        resetSequence();
        return;
      }

      playSequence();
    });
  </script>
