<style>
:root{
  --bg:#ffffff;
  --bg2:#f7f7f5;
  --border:#e8e6e0;
  --text:#111111;
  --mid:#444;
  --muted:#999;
  --blue:#3D5AFE;
  --bluel:rgba(61,90,254,0.08);
  --serif:'EB Garamond',Georgia,serif;
  --sans:'DM Sans',system-ui,sans-serif;
  --mono:'DM Mono',monospace;
  --ease:cubic-bezier(0.16,1,0.3,1);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.7;overflow-x:hidden;cursor:none;}
/* 手机端恢复默认光标和点击 */
@media(hover:none),(pointer:coarse){
  body,*{cursor:auto!important;}
  #cur,#cur-ring{display:none!important;}
}

/* CURSOR */
#cur{position:fixed;width:8px;height:8px;background:#3D5AFE;border-radius:50%;pointer-events:none;z-index:10000;transform:translate(-50%,-50%);transition:width .15s,height .15s,opacity .2s;left:-50px;top:-50px;}
#cur-ring{position:fixed;width:30px;height:30px;border:1px solid rgba(61,90,254,.4);border-radius:50%;pointer-events:none;z-index:9999;transform:translate(-50%,-50%);transition:width .3s var(--ease),height .3s var(--ease),opacity .2s,border-color .2s;left:-50px;top:-50px;}
body.ch #cur{width:40px;height:40px;border-radius:50%;background:var(--blue);opacity:.7;}
body.ch #cur-ring{opacity:0;}

/* READING PATH */
.reading-rail{position:fixed;right:24px;top:50%;z-index:180;transform:translateY(-50%);display:flex;flex-direction:column;align-items:center;gap:11px;}
.reading-track{position:absolute;top:0;bottom:0;width:1px;background:var(--border);z-index:-1;}
.reading-progress{position:absolute;top:0;width:1px;height:0;background:var(--blue);z-index:-1;transition:height .12s linear;}
.reading-dot{width:7px;height:7px;border-radius:50%;border:1px solid var(--border);background:#fff;transition:transform .3s var(--ease),background .3s,border-color .3s;position:relative;}
.reading-dot::after{content:attr(data-label);position:absolute;right:14px;top:50%;transform:translateY(-50%) translateX(5px);font-family:var(--mono);font-size:9px;letter-spacing:.08em;color:var(--muted);white-space:nowrap;opacity:0;transition:opacity .2s,transform .2s;}
.reading-dot:hover::after,.reading-dot.active::after{opacity:1;transform:translateY(-50%) translateX(0);}
.reading-dot.active{background:var(--blue);border-color:var(--blue);transform:scale(1.35);}

/* CANVAS */
#pc{position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.35;}

/* ENTRY */
#entry{position:fixed;inset:0;z-index:1000;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .9s var(--ease),transform .9s var(--ease);}
#entry.out{opacity:0;transform:translateY(-16px);pointer-events:none;}
.e-name{font-family:var(--serif);font-size:clamp(56px,10vw,120px);line-height:1;letter-spacing:-.025em;color:var(--text);opacity:0;animation:fu .8s .15s var(--ease) forwards;}
.e-name span{color:var(--blue);}
.e-sub{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;margin-top:18px;opacity:0;animation:fu .6s .45s var(--ease) forwards;display:flex;align-items:center;gap:4px;}
.e-cursor{display:inline-block;width:2px;height:13px;background:var(--text);animation:blink 1s step-end infinite;margin-left:1px;vertical-align:middle;}
.e-hint{position:absolute;bottom:44px;font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.08em;display:flex;align-items:center;gap:7px;opacity:0;animation:fu .5s .85s var(--ease) forwards;}
.ekey{border:1px solid var(--border);padding:2px 7px;border-radius:3px;font-size:10px;background:var(--bg2);}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
@keyframes fu{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* NAV */
nav{position:fixed;top:0;left:0;right:0;z-index:200;display:flex;align-items:center;justify-content:space-between;padding:20px 60px;transition:all .3s;}
nav.solid{background:rgba(255,255,255,.93);backdrop-filter:blur(14px);border-bottom:1px solid var(--border);padding:13px 60px;}
.nav-logo{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.1em;}
.nav-r{display:flex;align-items:center;gap:24px;}
.nav-links a{font-size:11px;color:var(--muted);text-decoration:none;letter-spacing:.08em;text-transform:uppercase;transition:color .2s;margin-left:24px;}
.nav-links a:hover{color:var(--text);}
.lang-tog{display:flex;background:var(--bg2);border:1px solid var(--border);border-radius:20px;padding:2px;cursor:none;}
.lang-tog span{font-family:var(--mono);font-size:10px;padding:3px 10px;border-radius:18px;letter-spacing:.06em;transition:all .25s var(--ease);color:var(--muted);user-select:none;}
.lang-tog span.active{background:var(--text);color:#fff;}
.clock{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.03em;}

/* MAIN */
#main{opacity:0;transition:opacity .7s var(--ease);}
#main.on{opacity:1;}

/* LAYOUT */
.wrap{max-width:720px;margin:0 auto;padding:0 60px;}
.sec-label{font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:var(--muted);text-transform:uppercase;margin-bottom:36px;display:block;}

/* HERO */
#hero{padding:130px 0 80px;}
.hero-meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.hero-est{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.1em;}
.hero-name{font-family:var(--serif);font-size:clamp(40px,5.5vw,68px);line-height:1.04;letter-spacing:-.02em;margin-bottom:4px;}
.hero-en{font-family:var(--serif);font-style:italic;font-size:clamp(16px,1.8vw,22px);color:var(--muted);margin-bottom:28px;}

/* HERO CARD */
.hero-card{border:1px dashed var(--border);padding:22px 26px;margin-bottom:28px;transition:border-color .3s;position:relative;}
.hero-card:hover{border-color:rgba(61,90,254,.35);}
.hc-top{display:flex;align-items:center;gap:14px;margin-bottom:14px;}
.hc-photo{width:42px;height:42px;border-radius:50%;object-fit:cover;object-position:top center;border:1.5px solid var(--border);flex-shrink:0;}
.hc-id .hc-name{font-size:14px;font-weight:500;color:var(--text);display:flex;align-items:center;gap:5px;}
.hc-id .hc-role{font-size:12px;color:var(--muted);}
.hc-bio{font-size:14px;color:var(--mid);line-height:1.85;margin-bottom:16px;}
.hc-bio strong{color:var(--text);font-weight:500;}
.hc-shortcut{font-family:var(--mono);font-size:11px;color:var(--muted);display:inline-flex;align-items:center;gap:5px;cursor:none;transition:color .2s;}
.hc-shortcut:hover{color:var(--text);}
.key{border:1px solid var(--border);padding:1px 6px;border-radius:3px;font-size:10px;background:var(--bg2);}
.copy-fb{color:var(--blue);opacity:0;transition:opacity .3s;font-size:10px;margin-left:4px;}
.chips{display:flex;flex-wrap:wrap;gap:6px;}
.chip{font-family:var(--mono);font-size:10px;padding:4px 10px;border:1px solid var(--border);border-radius:20px;color:var(--muted);transition:all .2s;cursor:default;}
.chip.b{border-color:rgba(61,90,254,.3);color:var(--blue);background:var(--bluel);}
.chip:hover{border-color:var(--blue);color:var(--blue);}

/* SECTION */
.section{padding:80px 0;border-top:1px solid var(--border);}

/* ABOUT */
.about-grid{display:grid;grid-template-columns:1fr 190px;gap:48px;align-items:start;}
.about-text{font-size:14.5px;color:var(--mid);line-height:1.95;}
.about-text p+p{margin-top:15px;}
.about-text strong{color:var(--text);font-weight:500;}
.a-stats{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--border);border:1px solid var(--border);}
.a-stat{background:var(--bg);padding:18px 14px;transition:background .2s;}
.a-stat:hover{background:var(--bluel);}
.a-stat-n{font-family:var(--serif);font-size:28px;color:var(--blue);line-height:1;margin-bottom:3px;}
.a-stat-l{font-family:var(--mono);font-size:9px;color:var(--muted);letter-spacing:.04em;line-height:1.4;}
.stack-grid{display:flex;flex-wrap:wrap;gap:8px;margin-top:32px;}
.stack-item{display:flex;align-items:center;gap:7px;padding:7px 12px;border:1px solid var(--border);border-radius:6px;font-size:12px;color:var(--mid);transition:all .2s;cursor:default;}
.stack-item:hover{border-color:var(--blue);color:var(--blue);transform:translateY(-1px);}
.s-dot{width:5px;height:5px;border-radius:50%;background:var(--blue);opacity:.55;flex-shrink:0;}

/* PROJECTS */
.proj-cards{display:grid;grid-template-columns:1.55fr 1fr;gap:12px;margin-bottom:32px;align-items:start;}
.proj-cards-right{display:flex;flex-direction:column;gap:12px;}
.proj-card-img{border-radius:6px;overflow:hidden;cursor:none;position:relative;transition:opacity .45s var(--ease),transform .45s var(--ease);flex-shrink:0;aspect-ratio:3/4;}
.proj-card-img img{width:100%;height:100%;object-fit:cover;object-position:center 15%;display:block;}
.proj-card-img .card-label{position:absolute;bottom:10px;left:12px;font-family:var(--mono);font-size:9px;color:rgba(17,17,17,.6);letter-spacing:.06em;}
.proj-cards:has(.proj-card-img:hover) .proj-card-img{opacity:.38;transform:scale(.96);}
.proj-cards:has(.proj-card-img:hover) .proj-card-img:hover{opacity:1;transform:scale(1.025);}

.proj-list{display:flex;flex-direction:column;}
.proj-item{display:flex;padding:18px 0;border-bottom:1px solid var(--border);cursor:none;transition:padding .2s var(--ease);align-items:flex-start;gap:20px;}
.proj-item:first-child{border-top:1px solid var(--border);}
.proj-item:hover{padding-left:6px;}
.proj-num{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.06em;padding-top:2px;flex-shrink:0;width:22px;}
.proj-info{flex:1;}
.proj-name{font-size:15px;font-weight:500;color:var(--text);margin-bottom:3px;display:flex;align-items:center;gap:7px;}
.proj-arr{font-size:12px;color:var(--muted);transition:transform .2s,color .2s;}
.proj-item:hover .proj-arr{transform:translateX(4px);color:var(--blue);}
.proj-desc{font-size:13px;color:var(--muted);line-height:1.6;}
.proj-tags{display:flex;gap:5px;margin-top:7px;flex-wrap:wrap;}
.proj-tag{font-family:var(--mono);font-size:9px;padding:2px 7px;border:1px solid var(--border);border-radius:20px;color:var(--muted);}

.work-hint{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(12px);padding:10px 12px;border:1px solid var(--border);border-radius:999px;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:var(--mid);opacity:0;pointer-events:none;transition:opacity .35s var(--ease),transform .35s var(--ease);z-index:650;white-space:nowrap;}
.work-hint.on{opacity:1;transform:translateX(-50%) translateY(0);}

/* EXPERIENCE - with timeline */
.exp-wrap{position:relative;}
.exp-wrap::before{content:'';position:absolute;left:0;top:0;bottom:0;width:1px;background:linear-gradient(to bottom,var(--border) 0%,var(--blue) 30%,var(--border) 100%);}
.exp-list{display:flex;flex-direction:column;padding-left:28px;}
.exp-item{position:relative;padding:22px 0;border-bottom:1px solid var(--border);display:grid;grid-template-columns:130px 1fr;gap:20px;transition:opacity .45s var(--ease),transform .45s var(--ease),padding .2s;}
body.motion-ready .exp-item{opacity:.42;transform:translateY(8px);}
body.motion-ready .exp-item.in-focus{opacity:1;transform:none;}
.exp-item:first-child{border-top:1px solid var(--border);}
.exp-item::before{content:'';position:absolute;left:-32px;top:28px;width:8px;height:8px;border-radius:50%;background:var(--bg);border:1.5px solid var(--border);transition:border-color .3s,background .3s;}
.exp-item:hover::before{border-color:var(--blue);background:var(--blue);}
.exp-date{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.03em;line-height:1.5;padding-top:2px;}
.exp-co{font-size:14px;font-weight:500;color:var(--text);margin-bottom:1px;display:flex;align-items:center;gap:7px;}
.exp-logo{width:16px;height:16px;border-radius:3px;background:var(--bg2);border:1px solid var(--border);display:inline-flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:6px;color:var(--muted);flex-shrink:0;}
.exp-role{font-size:12px;color:var(--muted);margin-bottom:8px;}
.exp-bullets{list-style:none;display:flex;flex-direction:column;gap:5px;}
.exp-bullets li{font-size:13px;color:var(--mid);line-height:1.65;padding-left:12px;position:relative;}
.exp-bullets li::before{content:'—';position:absolute;left:0;color:var(--muted);font-size:10px;top:2px;}
.exp-bullets li strong{color:var(--text);font-weight:500;}

/* EDUCATION */
.edu-wrap{display:flex;flex-direction:column;gap:0;}
.edu-item{display:grid;grid-template-columns:130px 1fr;gap:20px;padding:22px 0;border-bottom:1px solid var(--border);position:relative;padding-left:28px;transition:padding .2s;}
.edu-item:first-child{border-top:1px solid var(--border);}
.edu-item::before{content:'';position:absolute;left:0;top:28px;width:8px;height:8px;border-radius:50%;background:var(--bg);border:1.5px solid var(--border);transition:border-color .3s,background .3s;}
.edu-item:hover::before{border-color:var(--blue);background:var(--blue);}
.edu-date{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.03em;line-height:1.5;padding-top:2px;}
.edu-school{font-size:14px;font-weight:500;color:var(--text);margin-bottom:1px;display:flex;align-items:center;gap:8px;}
.edu-logo{width:16px;height:16px;border-radius:3px;background:var(--bg2);border:1px solid var(--border);display:inline-flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:6px;color:var(--muted);flex-shrink:0;}
.edu-major{font-size:12px;color:var(--muted);margin-bottom:8px;}
.edu-gpa{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10px;color:var(--blue);background:var(--bluel);border:1px solid rgba(61,90,254,.18);border-radius:20px;padding:2px 9px;margin-bottom:10px;}
.edu-awards{display:flex;flex-direction:column;gap:4px;margin-top:6px;}
.edu-award{font-size:12px;color:var(--mid);line-height:1.55;padding-left:12px;position:relative;}
.edu-award::before{content:'—';position:absolute;left:0;color:var(--muted);font-size:10px;top:1px;}
.edu-award strong{color:var(--text);font-weight:500;}
.edu-award .aw-level{font-family:var(--mono);font-size:9px;color:var(--muted);margin-left:5px;background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:1px 6px;}
.edu-award .aw-level.nat{color:var(--blue);border-color:rgba(61,90,254,.25);background:var(--bluel);}
.edu-more-toggle{font-family:var(--mono);font-size:10px;color:var(--muted);cursor:none;margin-top:8px;display:inline-flex;align-items:center;gap:4px;transition:color .2s;user-select:none;}
.edu-more-toggle:hover{color:var(--blue);}
.edu-more-toggle svg{transition:transform .25s;}
.edu-more-toggle.open svg{transform:rotate(180deg);}
.edu-hidden{display:none;}
.edu-hidden.show{display:flex;flex-direction:column;gap:4px;margin-top:4px;}

/* PROJECT STACK */
.proj-stack-wrap{height:auto;position:relative;margin-bottom:44px;cursor:none;}
.proj-stack{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;width:100%;}
.stack-card{position:relative;width:100%;height:360px;border:1px solid var(--border);border-radius:10px;overflow:hidden;cursor:none;background:var(--bg);box-shadow:0 8px 28px rgba(17,17,17,.07);transition:transform .35s var(--ease),box-shadow .35s var(--ease),border-color .35s;}
.stack-card.featured{grid-column:1/-1;height:310px;}
.stack-card.featured .stack-card-inner{grid-template-columns:1.28fr .72fr;grid-template-rows:1fr;}
.stack-card.featured .stack-card-foot{border-top:0;border-left:1px solid var(--border);display:flex;flex-direction:column;justify-content:flex-end;padding:26px;}
.stack-card:hover{transform:translateY(-7px);border-color:rgba(61,90,254,.3);box-shadow:0 18px 44px rgba(17,17,17,.12);}
.stack-card-inner{width:100%;height:100%;display:grid;grid-template-rows:minmax(0,1fr) auto;}
.stack-card-body{position:relative;min-height:0;overflow:hidden;}
.cover-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 18%;display:block;z-index:3;transition:transform .55s var(--ease);}
.stack-card:hover .cover-img{transform:scale(1.025);}
.stack-card-foot{position:relative;z-index:4;padding:15px 16px 16px;background:#fff;border-top:1px solid var(--border);}
.stack-card-foot.light{background:#fff;}
.sc-num{font-family:var(--mono);font-size:9px;color:rgba(17,17,17,.35);letter-spacing:.12em;margin-bottom:4px;}
.sc-num.dk{color:rgba(17,17,17,.4);}
.sc-title{font-family:var(--serif);font-size:16px;color:var(--text);line-height:1.2;margin-bottom:3px;}
.sc-title.dk{color:var(--text);}
.sc-sub{font-family:var(--mono);font-size:9px;color:var(--muted);letter-spacing:.08em;}
.sc-sub.dk{color:var(--muted);}

/* PROJECT CARDS */

.proj-card-cover{width:100%;height:100%;display:block;position:relative;overflow:hidden;}

.cover-poop .cv-glow{display:none;}
.cover-poop .cv-icon{position:absolute;top:50%;left:50%;transform:translate(-50%,-58%);z-index:1;}
.cover-poop .cv-ring{width:56px;height:56px;border-radius:50%;border:1px solid rgba(61,90,254,.5);display:flex;align-items:center;justify-content:center;}
.cover-poop .cv-ring-outer{width:80px;height:80px;border-radius:50%;border:1px solid rgba(61,90,254,.18);position:absolute;}

.cover-collar .cv-shape{position:absolute;top:50%;left:50%;transform:translate(-50%,-58%);z-index:1;}

/* Agent card */
.cover-agent{background:#f2f1ef;}
.cover-agent .cv-code{position:absolute;inset:0;padding:22px 20px;font-family:var(--mono);font-size:8px;line-height:1.9;color:rgba(17,17,17,.18);overflow:hidden;user-select:none;}

<script>
document.addEventListener('DOMContentLoaded', function() {
// CURSOR
const cur=document.getElementById('cur'),ring=document.getElementById('cur-ring');
let mx=0,my=0,rx=0,ry=0;
document.addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY;cur.style.left=mx+'px';cur.style.top=my+'px';});
(function ar(){rx+=(mx-rx)*.12;ry+=(my-ry)*.12;ring.style.left=rx+'px';ring.style.top=ry+'px';requestAnimationFrame(ar);})();
document.querySelectorAll('a,.proj-item,.stack-card,.c-row,button,.lang-tog,.hc-shortcut,.stack-item,.chip.b').forEach(el=>{
  el.addEventListener('mouseenter',()=>document.body.classList.add('ch'));
  el.addEventListener('mouseleave',()=>document.body.classList.remove('ch'));
});

// PARTICLES
const canvas=document.getElementById('pc'),ctx=canvas.getContext('2d');
let W,H,mouse={x:-999,y:-999};
function rsz(){W=canvas.width=window.innerWidth;H=canvas.height=window.innerHeight;}
rsz();window.addEventListener('resize',rsz);
document.addEventListener('mousemove',e=>{mouse.x=e.clientX;mouse.y=e.clientY;});
class P{
  constructor(){this.r();}
  r(){this.x=Math.random()*W;this.y=Math.random()*H;this.bx=this.x;this.by=this.y;this.sz=Math.random()*.7+.2;this.vx=(Math.random()-.5)*.18;this.vy=(Math.random()-.5)*.18;this.a=Math.random()*.12+.03;}
  u(){
    const dx=mouse.x-this.x,dy=mouse.y-this.y,d=Math.sqrt(dx*dx+dy*dy);
    if(d<90){const f=(90-d)/90,a=Math.atan2(dy,dx);this.x-=Math.cos(a)*f*2.5;this.y-=Math.sin(a)*f*2.5;}
    else{this.x+=(this.bx-this.x)*.02+this.vx;this.y+=(this.by-this.y)*.02+this.vy;}
    this.bx+=this.vx*.2;this.by+=this.vy*.2;
    if(this.bx<0)this.bx=W;if(this.bx>W)this.bx=0;
    if(this.by<0)this.by=H;if(this.by>H)this.by=0;
  }
  d(){ctx.beginPath();ctx.arc(this.x,this.y,this.sz,0,Math.PI*2);ctx.fillStyle=`rgba(17,17,17,${this.a})`;ctx.fill();}
}
const pts=Array.from({length:45},()=>new P());
(function anim(){ctx.clearRect(0,0,W,H);pts.forEach(p=>{p.u();p.d();});requestAnimationFrame(anim);})();

// ENTRY
const entry=document.getElementById('entry'),main=document.getElementById('main');
function setEntered(){
  entry.style.display='none';
  main.classList.add('on');
  cur.style.mixBlendMode='difference';
  cur.style.background='var(--text)';
  ring.style.borderColor='rgba(17,17,17,.25)';
}
function enter(){
  entry.classList.add('out');
  cur.style.mixBlendMode='difference';
  cur.style.background='var(--text)';
  ring.style.borderColor='rgba(17,17,17,.25)';
  setTimeout(()=>{entry.style.display='none';main.classList.add('on');},900);
}
document.addEventListener('keydown',e=>{if(e.key==='Enter')enter();});
entry.addEventListener('click',enter);

// CLOCK
function tick(){
  const t=new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
  document.getElementById('clock').textContent=`⏱ ${t} GMT+8`;
}
tick();setInterval(tick,1000);

// NAV + READING PATH
const readingProgress=document.getElementById('readingProgress');
const readingDots=Array.from(document.querySelectorAll('.reading-dot'));
const readingSections=readingDots.map(dot=>document.getElementById(dot.dataset.section)).filter(Boolean);
function updateReadingPath(){
  document.getElementById('nav').classList.toggle('solid',scrollY>50);
  const max=document.documentElement.scrollHeight-innerHeight;
  const pct=max>0?Math.min(1,Math.max(0,scrollY/max)):0;
  if(readingProgress)readingProgress.style.height=`${pct*100}%`;
  let active=readingSections[0]?.id;
  readingSections.forEach(section=>{if(section.getBoundingClientRect().top<=innerHeight*.42)active=section.id;});
  readingDots.forEach(dot=>dot.classList.toggle('active',dot.dataset.section===active));
}
window.addEventListener('scroll',updateReadingPath,{passive:true});
window.addEventListener('resize',updateReadingPath);
updateReadingPath();

// LANG TOGGLE
let lang='zh';
const langEls=Array.from(document.querySelectorAll('[data-en]'));
function applyLang(){
  document.getElementById('langTog').querySelectorAll('span').forEach(s=>s.classList.toggle('active',s.dataset.lang===lang));
  langEls.forEach(el=>{
    const val=el.getAttribute('data-'+lang);
    if(val)el.innerHTML=val;
  });
  document.documentElement.lang=lang==='zh'?'zh-CN':'en';
}
applyLang();
document.getElementById('langTog').addEventListener('click',function(){
  lang=lang==='en'?'zh':'en';
  applyLang();
});

// WORK HINT
const workHint=document.getElementById('workHint');
let workHintShown=false;
let workHintTimer=null;
function showWorkHint(){
  if(!workHint||workHintShown)return;
  workHintShown=true;
  workHint.classList.add('on');
  clearTimeout(workHintTimer);
  workHintTimer=setTimeout(()=>workHint.classList.remove('on'),5200);
}
const workSec=document.getElementById('work');
if(workSec&&workHint){
  const workHintObs=new IntersectionObserver(es=>{
    if(es.some(e=>e.isIntersecting)){
      showWorkHint();
      workHintObs.disconnect();
    }
  },{threshold:.28});
  workHintObs.observe(workSec);
}
document.querySelectorAll('.proj-item,.stack-card').forEach(el=>el.addEventListener('click',()=>workHint&&workHint.classList.remove('on')));

if(window.location.hash){
  setEntered();
  requestAnimationFrame(()=>{
    const target=document.querySelector(window.location.hash);
    if(target)target.scrollIntoView({behavior:'auto',block:'start'});
  });
  setTimeout(showWorkHint,240);
}

// REVEAL
const obs=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)e.target.classList.add('on');}),{threshold:.08});
document.querySelectorAll('.rv').forEach(el=>obs.observe(el));
document.body.classList.add('motion-ready');
const expObs=new IntersectionObserver(es=>es.forEach(e=>e.target.classList.toggle('in-focus',e.isIntersecting)),{rootMargin:'-28% 0px -42% 0px',threshold:0});
document.querySelectorAll('.exp-item').forEach(el=>expObs.observe(el));

// COPY EMAIL
function doCopy(){
  navigator.clipboard.writeText('runmengM@outlook.com').then(()=>{
    const fb=document.getElementById('copyFb');
    fb.style.opacity='1';setTimeout(()=>fb.style.opacity='0',2000);
  });
}
document.getElementById('copyEmail').addEventListener('click',doCopy);
document.addEventListener('keydown',e=>{
  if(e.key==='c'&&!e.metaKey&&!e.ctrlKey&&!e.altKey&&main.classList.contains('on'))doCopy();
});

// EDUCATION TOGGLE
const eduToggle=document.getElementById('edu-toggle');
const eduMore=document.getElementById('edu-more');
const eduToggleLabel=document.getElementById('edu-toggle-label');
if(eduToggle){
  eduToggle.addEventListener('click',()=>{
    const open=eduMore.classList.toggle('show');
    eduToggle.classList.toggle('open',open);
    const isZh=document.documentElement.lang==='zh-CN';
    eduToggleLabel.textContent=open?(isZh?'收起':'Collapse'):(isZh?'展开另外 5 项':'5 more awards');
  });
}

// MODAL
const PROJECTS={
  collar:{label:"02 · 米家智能宠物项圈",slides:[
    {step:"背景 / 01 of 04",title:"起点：<em>一个被误判的赛道</em>",body:`市场上已有一批主打 GPS 定位的智能宠物穿戴设备。<br><br>但用户真正在意的，是「知道我的猫在哪里」，还是「感觉和它更近一点」？<br><br><strong>这是这个项目最初想搞清楚的问题。</strong>`,pills:["智能宠物穿戴市场","用户心理模型","竞品格局重构"]},
    {step:"用户研究 / 02 of 04",title:"5组访谈，发现了<em>意料之外的答案</em>",body:`设计了 A/C/D 三组用户框架（N=7），验证「宠物主焦虑程度」与「GPS需求」的关联。<br><br>结果发现：<div class="hl">焦虑程度远低于预期，用户更在乎「陪伴感」而非「追踪感」</div>同时挖掘出非预设场景——<strong>携宠出行时的实时状态感知</strong>。`,pills:["A/C/D三组框架","N=7","探索性发现"]},
    {step:"产品定义 / 03 of 04",title:"重构定位：<em>从追踪器到伴侣感知设备</em>",body:`小红书关键词分析显示，「遛宠日记」「今天走了多少步」的互动数据远高于「防走失」。<br><br><strong>不是告诉你「猫在哪」，而是告诉你「猫今天怎么样了」。</strong>`,pills:["遛宠日记","每日状态感知","社交分享场景"]},
    {step:"现状 / 04 of 04",title:"预立项文档 V2，<em>预计 2026.5 立项</em>",body:`完成预立项文档第二版，核心场景围绕「日常陪伴感知」重建功能框架。<br><br>竞争格局从「宠物追踪器」重构为以<strong>小天才儿童手表</strong>为主要参照。`,pills:["预立项文档V2","竞品重构","2026.5立项"]},
  ]},
  agent:{label:"03 · 竞品调研自动化 Agent",slides:[
    {step:"痛点 / 01 of 03",title:"竞品调研<em>太耗时间了</em>",body:`搜索 → 筛选 → 提取 → 整理 → 汇总……<br><br>这个流程是必要的，但也是重复劳动最密集的环节。<br><br><strong>这个流程能不能自动化？</strong>`,pills:["重复劳动","效率瓶颈","自动化机会"]},
    {step:"搭建 / 02 of 03",title:"Coze 多节点工作流：<em>串联起来</em>",body:`按照宠物产品调研逻辑自动输出结构化竞品结论：<br><br>搜索插件 → 关键词提取 → 多维度分析 → 结构化输出<br><br>原本需要数小时的调研，<strong>压缩成了几分钟的自动化流程</strong>。`,pills:["Coze","多节点编排","结构化输出"]},
    {step:"收获 / 03 of 03",title:"最大的收获：<em>踩过真实的坑</em>",body:`调试中遇到两个核心瓶颈：<br><br><strong>LLM 幻觉</strong> — 模型生成看起来合理但不准确的竞品信息<br><strong>数据源反爬</strong> — 京东、淘天等平台限制自动化访问<br><br><div class="hl">这些一手认知，让我在做 AI 产品定义时对可行性判断更准确。</div>`,pills:["LLM幻觉","工程化边界","一手认知"]},
  ]}
};
let cp=null,cs=0;
const ov=document.getElementById('ov'),sw=document.getElementById('sw'),de=document.getElementById('dots'),pb=document.getElementById('pb'),nb=document.getElementById('nb2'),cb=document.getElementById('cbtn'),ml=document.getElementById('mlabel');
function renderSlides(k){const p=PROJECTS[k];ml.textContent=p.label;sw.innerHTML='';de.innerHTML='';p.slides.forEach((s,i)=>{const el=document.createElement('div');el.className='slide'+(i===0?' active':'');el.innerHTML=`<div class="sstep">${s.step}</div><h2 class="stitle">${s.title}</h2><div class="sbody">${s.body}<div class="spills">${s.pills.map(x=>`<span class="spill">${x}</span>`).join('')}</div></div>`;sw.appendChild(el);const d=document.createElement('div');d.className='di'+(i===0?' active':'');de.appendChild(d);});upNav();}
function goTo(i){const ss=sw.querySelectorAll('.slide'),ds=de.querySelectorAll('.di');ss[cs].classList.remove('active');ss[cs].classList.add('exit');setTimeout(()=>ss[cs]&&ss[cs].classList.remove('exit'),400);cs=i;ss[cs].classList.add('active');ds.forEach((d,j)=>d.classList.toggle('active',j===cs));upNav();}
function upNav(){const t=PROJECTS[cp].slides.length;pb.disabled=cs===0;nb.disabled=cs===t-1;}
function openM(k){cp=k;cs=0;renderSlides(k);ov.classList.add('open');document.body.style.overflow='hidden';}
function closeM(){ov.classList.remove('open');document.body.style.overflow='';}
pb.onclick=()=>{if(cs>0)goTo(cs-1);};nb.onclick=()=>{if(cs<PROJECTS[cp].slides.length-1)goTo(cs+1);};cb.onclick=closeM;ov.onclick=e=>{if(e.target===ov)closeM();};
document.addEventListener('keydown',e=>{if(!ov.classList.contains('open'))return;if(e.key==='ArrowRight')nb.click();if(e.key==='ArrowLeft')pb.click();if(e.key==='Escape')closeM();});
document.querySelectorAll('[data-project]').forEach(el=>el.addEventListener('click',()=>openM(el.dataset.project)));

// data-link 跳转：同时支持 click 和 touchend（手机兼容）
function bindLink(el){
  let touchMoved=false;
  el.addEventListener('touchstart',()=>{touchMoved=false;},{passive:true});
  el.addEventListener('touchmove',()=>{touchMoved=true;},{passive:true});
  el.addEventListener('touchend',e=>{
    if(!touchMoved){e.preventDefault();window.location.href=el.dataset.link;}
  });
  el.addEventListener('click',()=>{window.location.href=el.dataset.link;});
}
document.querySelectorAll('[data-link]').forEach(bindLink);

}); // end DOMContentLoaded
</script>
