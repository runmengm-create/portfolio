<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f2efe7">
  <meta name="description" content="教育经历文字排版候选稿。">
  <title>教育经历 | 文字排版候选稿</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="prototype-page">
    <section class="education-typography" aria-labelledby="educationTitle">
      <header class="education-head">
        <h1 id="educationTitle">教育经历</h1>
        <p>从设计训练，到产品判断。</p>
      </header>

      <div class="education-field" aria-label="教育背景">
        <article class="education-record education-record-master">
          <p class="record-year">2024-2027</p>
          <h2>东华大学</h2>
          <p class="record-college">机械工程学院</p>
          <p class="record-degree">机械硕士</p>
          <p class="record-focus"><span>研究方向：</span>工业设计工程</p>
        </article>

        <span class="education-route" aria-hidden="true"></span>

        <article class="education-record education-record-bachelor">
          <p class="record-year">2020-2024</p>
          <h2>上海海事大学</h2>
          <p class="record-college">徐悲鸿艺术学院</p>
          <p class="record-degree">工业设计学士</p>
        </article>
      </div>
    </section>
  </main>
</body>
</html>
