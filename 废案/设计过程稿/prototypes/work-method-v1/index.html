<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>工作方式 · 候选预览 v1</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="preview-shell">
      <section class="work-method" aria-labelledby="work-method-title">
        <img
          class="work-method__art"
          src="../../generated/styleframes/candidates/work-method-horizontal-v1.png"
          alt="一条由场景墨场、技术限制碎片和规则结构连续变形而成的黑色手绘带，蓝线贯穿其中"
        />

        <header class="work-method__heading">
          <p class="eyebrow">WORK METHOD / 03</p>
          <h1 id="work-method-title">我习惯先把问题弄清楚。</h1>
          <span class="heading-line" aria-hidden="true"></span>
        </header>

        <ol class="work-method__steps" aria-label="工作方式三个动作">
          <li class="work-method__step work-method__step--scene">
            <span>看见真实场景</span>
          </li>
          <li class="work-method__step work-method__step--constraints">
            <span>摊开技术限制</span>
          </li>
          <li class="work-method__step work-method__step--rules">
            <span>形成可执行规则</span>
          </li>
        </ol>
      </section>
    </main>
  </body>
</html>
