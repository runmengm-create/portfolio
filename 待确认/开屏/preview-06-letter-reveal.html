<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Renee · 字标点亮原型</title>
  <style>
    :root {
      --paper: #f2efe7;
      --ink: #25241f;
      --blue: #2f63e9;
      --soft: #817c73;
      --ease: cubic-bezier(.16, 1, .3, 1);
    }

    * { box-sizing: border-box; }

    html,
    body {
      min-width: 320px;
      min-height: 100%;
      margin: 0;
      background: var(--paper) url("../../assets/paper-texture.png") repeat;
      background-size: 200px 200px;
    }

    body {
      min-height: 100dvh;
      overflow: hidden;
      color: var(--ink);
      font-family: "Noto Serif SC", "Songti SC", "STSong", serif;
    }

    .entry-stage {
      position: relative;
      display: grid;
      min-height: 100dvh;
      place-items: center;
      isolation: isolate;
    }

    .entry-core {
      position: relative;
      z-index: 1;
      display: grid;
      justify-items: center;
      gap: 2.6rem;
      width: min(86vw, 38rem);
      text-align: center;
    }

    .name-button {
      position: relative;
      display: inline-grid;
      place-items: center;
      min-width: 12rem;
      padding: 1.8rem 2.4rem 1.6rem;
      border: 0;
      background: transparent;
      color: inherit;
      cursor: pointer;
      font: inherit;
      -webkit-tap-highlight-color: transparent;
    }

    .name-button:focus-visible {
      outline: 1px solid var(--blue);
      outline-offset: .65rem;
    }

    .wordmark {
      position: relative;
      display: inline-block;
      --ball-start: -8px;
      --ball-end: 0px;
      font-family: Arial, "Helvetica Neue", sans-serif;
      font-size: clamp(4rem, 12vw, 8.5rem);
      font-weight: 700;
      letter-spacing: -.08em;
      line-height: .86;
    }

    .wordmark-base,
    .wordmark-reveal {
      display: block;
      white-space: nowrap;
    }

    .letter {
      display: inline-block;
      --push: .08em;
      animation: letter-push .48s var(--ease) both;
      animation-play-state: paused;
      will-change: transform;
    }

    .letter-1 { animation-delay: .38s; --push: .11em; }
    .letter-2 { animation-delay: .68s; --push: .1em; }
    .letter-3 { animation-delay: .98s; --push: .09em; }
    .letter-4 { animation-delay: 1.28s; --push: .08em; }
    .letter-5 { animation-delay: 1.58s; --push: .07em; }
    }

    .wordmark-base {
      color: rgba(37, 36, 31, .2);
    }

    .wordmark-reveal {
      position: absolute;
      inset: 0;
      color: var(--ink);
      clip-path: inset(0 100% 0 0);
      animation: letter-reveal 2.45s var(--ease) .2s forwards;
      animation-play-state: paused;
    }

    .ball {
      position: absolute;
      top: 58%;
      left: -3%;
      width: clamp(.7rem, 1.25vw, 1rem);
      aspect-ratio: 1;
      border-radius: 50%;
      background: var(--blue);
      box-shadow: 0 .45rem .7rem rgba(47, 99, 233, .18);
      transform: translate3d(var(--ball-start), -50%, 0);
      animation: ball-track 2.45s var(--ease) .2s forwards;
      animation-play-state: paused;
      will-change: transform;
    }

    .ball::after {
      position: absolute;
      right: 50%;
      bottom: -.58rem;
      width: 2rem;
      height: .28rem;
      border-radius: 50%;
      background: rgba(47, 99, 233, .18);
      content: "";
      filter: blur(4px);
      opacity: .22;
      transform: translateX(50%);
    }

    .entry-hint {
      color: var(--soft);
      font-size: .72rem;
      letter-spacing: .14em;
    }

    .entry-stage.is-transitioning .entry-core {
      animation: entry-fade .6s ease forwards;
    }

    .wordmark.is-ready .wordmark-reveal,
    .wordmark.is-ready .ball,
    .wordmark.is-ready .letter {
      animation-play-state: running;
    }

    @keyframes letter-reveal {
      from { clip-path: inset(0 100% 0 0); }
      to { clip-path: inset(0 0 0 0); }
    }

    @keyframes letter-push {
      0%, 25%, 100% { transform: translateX(0); }
      52% { transform: translateX(var(--push)); }
    }

    @keyframes ball-track {
      from { transform: translate3d(var(--ball-start), -50%, 0); }
      to { transform: translate3d(var(--ball-end), -50%, 0); }
    }

    @keyframes entry-fade {
      to { opacity: 0; transform: scale(.985); }
    }

    @media (max-width: 640px) {
      .entry-core { gap: 2rem; }
      .name-button { min-width: 10rem; padding-inline: 1.2rem; }
      .wordmark { font-size: clamp(4rem, 21vw, 6.2rem); }
    }

    @media (prefers-reduced-motion: reduce) {
      .wordmark-reveal,
      .ball,
      .wordmark,
      .letter { animation: none; }
      .wordmark-reveal { clip-path: inset(0); }
      .ball { transform: translate3d(var(--ball-end), -50%, 0); }
      .entry-stage.is-transitioning .entry-core { animation-duration: .18s; }
    }
  </style>
</head>
<body>
  <main class="entry-stage" id="entryStage">
    <div class="entry-core">
      <button class="name-button" id="enterButton" type="button" aria-label="进入 Renee 的作品集">
        <span class="wordmark" aria-label="Renee">
          <span class="wordmark-base" aria-hidden="true"><span class="letter letter-1">R</span><span class="letter letter-2">e</span><span class="letter letter-3">n</span><span class="letter letter-4">e</span><span class="letter letter-5">e</span></span>
          <span class="wordmark-reveal" aria-hidden="true"><span class="letter letter-1">R</span><span class="letter letter-2">e</span><span class="letter letter-3">n</span><span class="letter letter-4">e</span><span class="letter letter-5">e</span></span>
          <span class="ball" aria-hidden="true"></span>
        </span>
      </button>
      <p class="entry-hint">CLICK TO ENTER</p>
    </div>
  </main>
  <script>
    const stage = document.getElementById("entryStage");
    const enterButton = document.getElementById("enterButton");
    const wordmark = enterButton.querySelector(".wordmark");
    let transitioning = false;

    const prepareBallTrack = () => {
      const width = wordmark.getBoundingClientRect().width;
      wordmark.style.setProperty("--ball-end", `${Math.round(width * 1.16 + 16)}px`);
      wordmark.classList.add("is-ready");
    };

    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(prepareBallTrack);
    } else {
      prepareBallTrack();
    }

    enterButton.addEventListener("click", () => {
      if (transitioning) return;
      transitioning = true;
      stage.classList.add("is-transitioning");
      window.setTimeout(() => {
        window.location.href = "preview-06-letter-detail.html";
      }, 840);
    });
  </script>
</body>
</html>
